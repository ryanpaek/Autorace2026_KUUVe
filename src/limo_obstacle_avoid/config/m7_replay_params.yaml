# M7 녹화 경로 재생 노드(m7_replay_node, launch에서 이름 avoid_node) 설정. avoid_params.yaml(차체·라이다) 뒤에 읽음.
# 항목 설명: limo_obstacle_avoid/m7_replay_core.py ReplayParams. 실행 중 바꾸기: ros2 param set /avoid_node trigger_mm 560.0
/**:
  ros__parameters:
    trigger_mm: 540.0          # ★ 녹화할 때 라이다 중심 -> 앞 장애물 거리 (녹화한 자리와 같게). 11/17 546 -> 540
    latency_s: 0.15            # 판단~반응 지연 (속도 x 지연만큼 일찍 판단)
    brake_k: 0.13              # 정지 명령 후 밀림 = 0.13 x 속도 (calib 4번)
    speed: 0.17                # 차로 따라 직진 (11/17 밤 0.20 -> 0.17: 차로 바꾼 뒤 차선 빨리 잡게. 재생 속도 exec_speed는 녹화와 같게 0.20)
    exec_speed: 0.20           # ★ 재생 속도 = 녹화 속도 (path_check.py가 알려 주는 평균)
    exec_rev_speed: 0.20
    align_speed: 0.15
    no_reverse: true           # 11/17: 재생 전후 앞뒤로 가운데 맞추기·오래 막힐 때 물러나기 빼고 차선 주행을 100% 믿음
    replay_reverse: true       #   녹화 파일 안 후진 구간은 녹화대로 (false면 전진 구간만 재생)
    anchor_actual_y: true      #   재생을 지금 옆 위치에서 시작해 목표 차로 가운데에서 끝나게 (가운데로 확 끌려가 장애물에 붙지 않게)
    align_before: false        # (no_reverse false일 때만) 재생 전 가운데 맞추기
    align_after: false         # (no_reverse false일 때만) 재생 뒤 가운데 맞추기
    align_tol_y: 0.03
    align_tol_psi_deg: 3.0
    align_back: 0.35
    align_cycles: 3
    exit_lead: 0.30
    m2_replay: true            # 11/17: M7 끝 지점에서 (지금 차로, A/B) 녹화 m2_{1|2|3}-{A|B}.csv 하나 재생 -> 갈래 안에서 끝
    m2_start_gap: 1.00         # ★ M2 녹화 시작 자세: 앞범퍼 ~ 섬 앞 꼭짓점 (m). 녹화할 때 잰 거리와 같게
    m2_fork_default: 'A'       #   A/B 표지를 그때까지 못 봤을 때
    sign_ignore: true          # 11/18: 섬 앞 꼭짓점 근처 작은 덩어리(갈림길 표지판)는 장애물로 안 봄 (닿기 직전 안전 정지엔 씀)
    sign_zone_before: 0.40     #   꼭짓점 앞 이만큼 ~ 뒤 sign_zone_after, 가운데 ± sign_zone_half 안에서
    sign_max_size: 0.12        #   앞뒤·옆 크기 둘 다 12 cm 안이면 표지판 (LIMO 폭 23 cm)
    m2_backup: true            # 11/18: M2 녹화 길이 지금 자리에선 막히고 녹화 시작 자리에선 되면 거기까지 후진 후 녹화대로
    m2_backup_max: 0.80        #   M2 시작 자리를 이만큼(+m2_late_max) 넘게 지났으면 안 함
    m2_test_start: false       # 시험용: 켜지는 자리를 곧바로 M2 시작 지점으로 (M7 건너뛰고 갈림길만)
    start_lane_no: 0           # 시험용: 켤 때 차로 번호 1/2/3 (0 = 2차선 가정, 카메라 차로 번호로 고쳐짐)
    backup_if_mm: 460.0        # 11/18 시험: 앞 장애물이 46 cm보다 가까우면 후진 (녹화 경로가 여유 3 cm로 통과하는 최소 거리). 11/17 350
    backup_to_mm: 500.0        #   50 cm까지 후진 (차선 노드로 가운데 맞추며) -> 그 자리에서 바로 재생
    exec_from_here: true       # 11/18 시험: 54~46 cm 사이면 녹화 경로를 지금 위치에 붙여 바로 재생
    backup_when_blocked: true  #   46~50 cm인데 지금 자세로 경로가 닿으면 50 cm까지 후진
    backup_lane_center: true   #   후진 중 가운데 맞추기를 차선 노드 offset/heading으로 (안 보이면 위치 추정)
    backup_speed: 0.12
    m2_mirror: true            #   없는 파일은 좌우 대칭 파일 뒤집어 씀 (1-A<->3-B, 1-B<->3-A, 2-A<->2-B)
    accel_reverse: true        # 11/17: 조종기(RC) 후진도 거리에서 빼기 (출발 가속도 방향으로 판단, 축은 자동으로 배움)
    accel_sign: 0              #   0 = 배움 / 1 = 가속도 +x가 앞 / -1 = 뒤 (고정)
    hit_margin: 0.03
    still_max_s: 1.0           # 11/17 밤: '완전히 섰나'(odom) 최대 기다림. 예전엔 odom이 1~2 mm만 흔들려도 재생 중단 뒤 영원히 서 있었음
    cruise_lane: true          # 11/17: 재생 전(직진)은 차선 기반 조향만 (/lane/status 곡률 그대로). 차선을 놓친 동안만 위치 추정
    plan_ahead: true           # 11/17: 트리거 전에도 장애물 위치·빠질 차로를 미리 계산 (/avoid/state plan, 조향엔 안 씀)
    path_left: ''              # 비우면 share/limo_obstacle_avoid/paths/m7_left.csv
    path_right: ''             #        .../m7_right.csv (한쪽만 있으면 거울상, 둘 다 없으면 기본 S자)
    # 11/18 시험 브랜치: 재생 중 노란선 안전장치 (끄기: ros2 param set /avoid_node exec_yellow_guard false)
    exec_yellow_guard: true
    eyg_clear_mm: 50.0         #   바퀴~노란선 여유가 이 밑으로 떨어질 때만 (최대 조향·지연·앞 모서리 고려한 예측값)
    eyg_psi_deg: 2.0           #   노란선 쪽으로 이만큼 이상 틀어져 있을 때만
    eyg_arm_frac: 0.30         #   재생 진행률 30% 지나야 켬
    eyg_frames: 2              #   연속 2프레임
    # 11/19 실차 '앞에 장애물 없는데 후진' (라이다 점 튐): 차로 장애물은 연속 3스캔 같은 자리(±10 cm)여야 트리거·후진·차로 고르기에 씀.
    #   라이다 점으로 정하는 후진(지금 자세로 막힘·출구 쪽·M2 시작 자리)도 그 판단이 연속 3스캔이어야. 차체 바로 앞 안전 정지는 그대로 1스캔
    #   예전으로: ros2 param set /avoid_node obs_confirm_frames 1 / reverse_confirm_frames 1
    obs_confirm_frames: 3
    obs_confirm_tol: 0.10
    reverse_confirm_frames: 3
    # 11/19 실차 '앞·옆 다 막혔다고 영원히 서 있음(틈 있는데)': 정해진 자리 녹화 경로가 양쪽 다 닿으면 (연속 3스캔 확인 뒤)
    #   조금 더 가서(최대 20 cm) / 물러나서(최대 50 cm) 녹화 경로나 만든 S자(25~60°, 반경 0.53 x 1.2)로 갈 길을 찾음.
    #   로그 '막힘 -> 다른 길: ...' / '다른 길도 없음'. 끄기: ros2 param set /avoid_node rescue false
    rescue: true
    rescue_r_scale: 1.2
    rescue_deg_min: 25.0
    rescue_deg_max: 60.0
    rescue_deg_step: 5.0
    rescue_margin: 0.04          #   만든 S자 검사 여유 (녹화 경로는 hit_margin 0.03)
    rescue_island_margin: 0.08   #   섬(도면 위치)은 위치 추정 오차만큼 더 넓게
    rescue_fwd_max: 0.20
    rescue_back: true            #   앞으로 갈 길이 없을 때만 물러나서 찾음 (false = 후진 안 함)
    rescue_back_max: 0.50
    rescue_step: 0.05
    rescue_back_step: 0.10
    rescue_tail: 0.15            #   도착 뒤 이만큼 더 가도 안 닿아야
    rescue_period_s: 0.5
