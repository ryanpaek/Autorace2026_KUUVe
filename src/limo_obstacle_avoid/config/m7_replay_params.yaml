# M7 녹화 경로 재생 노드(m7_replay_node, launch에서 이름 avoid_node) 설정. avoid_params.yaml(차체·라이다) 뒤에 읽음.
# 항목 설명: limo_obstacle_avoid/m7_replay_core.py ReplayParams. 실행 중 바꾸기: ros2 param set /avoid_node trigger_mm 560.0
/**:
  ros__parameters:
    trigger_mm: 546.0          # ★ 녹화할 때 라이다 중심 -> 앞 장애물 거리 (녹화한 자리와 같게)
    latency_s: 0.15            # 판단~반응 지연 (속도 x 지연만큼 일찍 판단)
    brake_k: 0.13              # 정지 명령 후 밀림 = 0.13 x 속도 (calib 4번)
    speed: 0.20                # 차로 따라 직진
    exec_speed: 0.20           # ★ 재생 속도 = 녹화 속도 (path_check.py가 알려 주는 평균)
    exec_rev_speed: 0.20
    align_speed: 0.15
    no_reverse: true           # 11/17: 후진 없음. 재생 전후 앞뒤로 가운데 맞추기·오래 막힐 때 물러나기 빼고 차선 주행을 100% 믿음
    replay_reverse: true       #   녹화 파일 안 후진 구간은 녹화대로 (false면 전진 구간만 재생)
    anchor_actual_y: true      #   재생을 지금 옆 위치에서 시작해 목표 차로 가운데에서 끝나게 (가운데로 확 끌려가 장애물에 붙지 않게)
    align_before: false        # (no_reverse false일 때만) 재생 전 가운데 맞추기
    align_after: false         # (no_reverse false일 때만) 재생 뒤 가운데 맞추기
    align_tol_y: 0.03
    align_tol_psi_deg: 3.0
    align_back: 0.35
    align_cycles: 3
    exit_lead: 0.30
    hit_margin: 0.03
    cruise_lane: true          # 11/17: 재생 전(직진)은 차선 기반 조향만 (/lane/status 곡률 그대로). 차선을 놓친 동안만 위치 추정
    plan_ahead: true           # 11/17: 트리거 전에도 장애물 위치·빠질 차로를 미리 계산 (/avoid/state plan, 조향엔 안 씀)
    path_left: ''              # 비우면 share/limo_obstacle_avoid/paths/m7_left.csv
    path_right: ''             #        .../m7_right.csv (한쪽만 있으면 거울상, 둘 다 없으면 기본 S자)
