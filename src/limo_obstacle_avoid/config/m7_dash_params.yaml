# M7 점선 기준 회피 (m7_dash_node, 11/19 실험·단독). 실행 중 바꾸기: ros2 param set /m7_dash_node <이름> <값> (다음 enable 때 반영)
# 회피 값은 시뮬 탐색으로 고름 (lookahead 0.25~0.45 x latency 0~0.3 x shift_len 0.5~0.9 x 속도 x 옆 여유)
m7_dash_node:
  ros__parameters:
    cmd_topic: /cmd_vel          # 합칠 때 /obstacle/cmd_vel
    speed: 0.20
    tight_speed: 0.14            # 연속 회피 빈 칸이 짧을 때
    lookahead: 0.25              # 0.45는 코너를 깎아 멈춤 잦음. 실차에서 좌우로 떨면 0.30
    latency: 0.2                 # 조향 지연 보상 (s)
    shift_len: 0.70
    clear: 0.05                  # 장애물 옆 여유. 재판단 때 1 cm씩 줄여 최소 clear_min까지
    clear_min: 0.015
    clear_x: 0.03
    hold_rear: 0.05
    # 끝: 표지판(fork_a/b) 상자 높이 >= end_sign_h_px 가 3번 연속 + x >= end_min_x. 못 보면 end_x에서 끝
    end_sign_h_px: 60.0          # ★ 실측: 멈추고 싶은 자리에서 ros2 topic echo /m7dash/state 의 sign_h 값
    end_min_x: 2.5
    end_x: 4.6                   # 거리 상한 (섬 앞 끝보다 짧게)
    # 멈추면: 0.8 s 뒤 재판단(기억 비우고 다시 봄) -> 길 있으면 감 / 다른 곡률로 비켜 감 / 곧게 후진 15 cm (최대 3번)
    recover_wait: 0.8
    recover_rev_max: 3           # 0 = 후진 안 함
    yellow_r_y: -0.52            # 오른쪽 노란선 안쪽 모서리 (점선 기준) — 실측
    white_v_min: 180             # params.yaml lane_node와 같은 값
    white_s_max: 60
