# 모든 노드(s1~s5, cmd_mux)가 같이 읽는 설정.  ★ 실수(float)는 꼭 소수점 붙이기 (1 → 1.0)
# 실행 중 바꾸기:  ros2 param set /avoid_node trigger_dist 1.2
/**:
  ros__parameters:
    # ── 토픽 (LIMO에서 ros2 topic list 로 확인 후 수정) ──
    scan_topic: /scan
    odom_topic: /odom
    imu_topic: /imu
    yaw_source: imu          # imu | odom   (3단계에서 더 정확한 쪽)
    imu_mode: auto           # auto | orientation | gyro  (auto: IMU 방향값이 없거나 안 변하면 자이로 적분으로 자동 전환)

    # ── 바퀴 명령 출력 (cmd_mux, s4) ──
    out_mode: twist          # twist: /cmd_vel → 팀 ackermann_bridge 필요 / ack: /limo/ack_cmd 직접 (브리지 끄기)
    cmd_topic: /cmd_vel
    ack_topic: /limo/ack_cmd
    angular_mode: yaw_rate   # twist 일 때 angular.z 의미: yaw_rate | steer_angle (4단계에서 옆 이동이 이상하면)
    wheelbase: 0.222         # 축거 [m] (팀 브리지 값과 같게, 줄자로 확인)
    lane_topic: /lane_follow/cmd_vel   # 차선추종 노드 출력 (remap 필요)
    avoid_topic: /avoid/cmd_vel
    timeout: 0.3             # cmd_mux: 이 시간 넘게 안 온 명령은 무시
    failsafe_hold: true      # 회피 중 회피 명령이 끊기면 차선추종으로 넘기지 않고 정지

    # ── 안전 ──
    odom_timeout: 0.3        # /odom 이 이만큼 끊기면 정지
    scan_timeout: 0.5        # /scan 이 이만큼 끊기면 정지

    # ── 트랙 ──
    lane_width: 0.52         # 이웃 차로 중심 간격. 도면: 선 사이 500 + 점선 20 = 520 mm (FSM three_lane_width_mm와 같게)
    num_side_lanes: 1
    start_lane: 0            # enable 순간 있는 차선 (0=가운데)
    start_target: 0          # 11/14: 코너에서 미리 정한 차로 (+1/-1, 0=없음). 팀 스택은 obstacle_node가 켤 때마다 넣음
    start_y: 0.0             # 11/14: 켤 때 시작 차로 중심에서 옆으로 [m] (코너 끝 전에 일찍 켤 때 obstacle_node가 넣음)
    section_length: 4.38     # ★ enable 지점 ~ 가운데 섬 앞 끝 거리. 도면 4384 mm, 대회장 실측
                             #   팀 스택(autorace.launch m7_avoid:=true)에서는 obstacle_node가 켤 때 위치로 다시 넣음
    island_length: 1.0
    use_island: true
    exit_lane: auto          # auto | A | B   (/fork_direction 토픽으로도 바뀜)
    fork_shift: true         # 갈림길 방향을 알면 섬 앞 끝 전에 출구 차선(A=1차선 +1 / B=3차선 -1)으로 미리 이동 (0/1/2차선)
    exit_margin: 0.20        # 섬 앞 끝까지 남길 여유 [m]
    exit_min_time: 0.6       # 시작 후 이 시간은 미리 이동 안 함 (라이다 지도 쌓일 때까지)
    done_margin: 0.3

    # ── 차량 ──
    robot_front: 0.20
    robot_rear: 0.16
    robot_half_width: 0.12
    side_margin: 0.05

    # ── 라이다 (1단계에서 확인) ──
    lidar_x: 0.10
    scan_yaw_offset_deg: 0.0
    scan_flip: false
    range_min: 0.10
    range_max: 3.0
    roi_front: 2.5
    roi_back: 0.6
    obs_max_center_y: 0.67   # 11/12 밤: 덩어리 중심이 이보다 밖이면 트랙 밖 물체(노이즈)로 버림 (바깥 차로 LIMO 중심 0.52 + 15 cm)
    merge_max_w: 0.30        # 11/12 밤 실차: 같은 장애물을 합칠 때 폭이 0.30 m 넘게 커지면 최근 관측 중심으로 줄임
    merge_max_len: 0.70      #   앞뒤는 안 줄임 (0.45로 줄이면 시뮬레이션 드리프트 조건 40 -> 33). 예전: 폭이 0.45 m까지 커져 옆 차로 침범 -> 정지
    # 11/12 밤: 막혀서 서게 되면 이번 라이다 한 바퀴로 똑바로 0.3 m 앞이 비었는지 보고, 비었으면 0.15 m/s로 0.3 m 전진 뒤 다시 판단 (최대 6번)
    creep: true
    creep_m: 0.30
    creep_speed: 0.15
    creep_max: 8
    creep_search: true       # 11/12 밤: 1초 넘게 막혀 있으면 양쪽으로 꺾은 길(반쯤·끝까지)도 지금 라이다로 굴려 봐서 빈 쪽으로 0.3 m 전진
    creep_search_after: 1.0
    creep_search_deg: 30.0   #   차로 방향에서 30° 넘게는 안 틂
    two_lane_wait: true      # 11/12 밤: 가운데 차로가 옆 장애물만 지나면 비는 거면 두 칸(1<->3) 건너기 보류하고 조금 더 가서 가운데로
    two_lane_wait_free: 0.60 #   지금 차로 앞이 이보다 짧으면 급하니 두 칸 허용
    side_wait_max: 6
    roi_side_extra: 0.10
    cluster_gap: 0.12
    cluster_min_pts: 3
    merge_dist: 0.20
    max_obs_width: 0.45
    max_obs_len: 0.70        # 앞뒤로 이보다 긴 덩어리는 벽으로 보고 버림 (LIMO 0.32)
    min_obs_size: 0.08       # 가로·세로 중 긴 쪽이 이보다 작으면 버림 (기둥·다리)
    obs_min_len: 0.33
    confirm_hits: 3

    # ── 판단 (5단계에서 튜닝) ──
    trigger_dist: 1.4        # 11/15 밤 1.8 -> 1.4 (앞범퍼 기준, 라이다 기준 1.5 m). tools/change_sweep.py: 1.8은 빈 곳에서 장애물 0.65 m 앞에 이미
                             #   도착(너무 이름), 1.0~1.1은 장애물 옆을 아직 비스듬히 지남, 1.4는 장애물 5~13 cm 앞에서 똑바로 도착. 후진·성공 같음
    exit_wall_trigger: 1.5   #   출구 반대쪽 가상 벽만 막을 때는 1.5 m (1.8이면 옆 장애물 다 지나기 전에 반응해 A/B 출구를 포기)
    change_len: 1.0
    clear_back: 0.0
    better_margin: 0.3
    rechoose_dy: 0.12        # 옮기기 시작했어도 원래 차로에서 12 cm 안이면, 새로 확정된 장애물로 다른 차로가 더 비면 목표를 바꿈 (11/11)
    rechoose_sec: 0.6        #   차로를 고른 뒤 0.6초 안에 한 번만 (계속 바꾸면 왔다 갔다)
    flip_block_sec: 1.5      # 11/12 밤: 방금 떠난 차로로 1.5초 안에는 안 돌아감 (실차 -1 <-> 0 0.4초마다 왔다갔다)
    flip_until_arrive: true  # 11/15: 떠난 차로로 돌아가기 막기를 새 차로에 도착할 때까지 (1.5초는 속도 0.2에서 옮기기 전에 풀림 -> 정했다 반대로 반복)
    flip_arrive_tol: 0.10
    flip_ok_free: 0.5
    hold_time: 0.4           # 11/12 0.8 -> 0.4: 차선 바꾼 뒤 다음 판단을 빨리 (옮기는 중에도 라이다로 계속 계산)
    stop_dist: 0.20          # 11/15: 0.30 -> 0.20 (정지·후진은 정말 가까울 때만, 복잡한 배치에서 못 가던 것). 지금 조향대로 0.3 m 더 가면 차체가 부딪힐 때만 정지(→ 후진). 옆 차로·옆에 붙은 장애물로는 안 섬 (11/10 밤)
    center_before_island: true   # 11/12 밤: 갈림길 표지를 아직 모르면 섬 앞 2.6~1.6 m에서 가능하면 2차로로 모음 (1·3차로에서 표지를 잘 못 봄)
    center_from_m: 2.6
    center_until_m: 1.6
    center_leave_m: 0.95     #   가운데에서 표지를 끝내 모르면 섬 앞 0.95 m에서 옆 차로로
    center_force: true       # 11/12 밤: M7 시작 약 4000 mm(섬 앞 2.07 m)에서 표지를 모르면 일단 2차선 (2차로 앞 1 m만 비면)
    center_force_rem_m: 2.07
    center_force_free: 1.0
    center_force_wait_m: 0.40  #   옆·앞에 장애물이 있으면 0.4 m 더 가서 다시 (섬 앞 1.6 m보다 가까워지면 안 함)
    shift_arc: true          # 11/15 밤: 차로 옮길 때 '딱 중심에서 펴지는 최대 각'으로 꺾음 (pure pursuit는 비스듬히 도착해 바깥으로 넘침)
    shift_r_scale: 1.25      #   펴는 원 = 최소 회전반경 x 1.25 (조향 지연 여유)
    shift_r_scale_outer: 1.4 #   바깥 차로(1·3)로 들어갈 때는 더 일찍 펴기 (노란 실선 물기 방지)
    outer_entry_bias: 0.03   #   바깥 차로로 들어갈 때 중심보다 3 cm 안쪽 겨냥
    shift_turn_len: 0.12
    island_sign_zone: 0.6    # 11/15 실차: 섬 앞 끝 가운데 갈림길 표지판을 2차선 장애물로 봐서 장애물 없는데 1차선으로 감 -> 섬 앞 0.6 m ~ 섬 끝, 2차선 ±15 cm 덩어리는 뺌
    island_sign_half_w: 0.15
    center_guard: true       # 11/15: 2차선으로 모으는 중 길이 막히면 정지·후진 대신 원래 차로로 돌아가 0.4 m 더 가서 다시
    center_guard_look: 0.15
    center_guard_free: 0.35
    cont_change: true        # 11/12: 옮기는 도중 가던 차로 앞이 막히면 다음 차로까지 이어서 한 번에 (안전 조건 아래)
    cont_min_free: 1.80      #   다음 차로 앞 1.8 m 넘게 비어야 (11/12 밤 1.3 -> 1.8: 두 차로 한 번에는 줄임)
    cont_island_m: 2.00      #   섬까지 2.0 m 넘게 남아야 (그리고 40° 안, 지나갈 길 빔, 한 번 옮길 때 한 번만)
    # 11/12 밤: 가능하면 2차로(가운데). 고르기 점수 = 앞 빈 거리(최대 3 m) - 1.2(두 칸 건너면) + 0.3(가운데면)
    two_lane_penalty: 1.2
    center_bonus: 0.3
    center_return: false     # 11/15 실차: 끔. 1차선 앞이 비었는데도 2차선으로 갔다 다시 1차선으로 가던 것 (섬 앞 표지 보러 모으기는 center_before_island·center_force)
    center_return_free: 2.6  # 11/15: 1.6 -> 2.6 (차로 바꾸는 기준 1.5 m와 겹쳐 가운데로 오다 바로 다시 나가던 것)
    center_return_sec: 1.0
    # 11/12 밤: 지도에 들어온 장애물이 안 지워져 사람 다리·튄 점이 차로를 영원히 막던 것 -> 앞면을 빔이 뚫고 지나가면 지움
    forget: true
    forget_scans: 4          #   4 스캔 연속
    forget_rays: 3           #   빔 3개 이상이 앞면 너머에서 반사(또는 반사 없음)
    forget_pass: 0.15
    forget_min_x: 0.25
    forget_max_x: 2.2
    clear_rollout: true      # 11/12: 옆 장애물을 지나는 중에도 꺾어 들어가는 길을 굴려 봐서 안 부딪히면 바로 옮김 (늦게 옮겨 후진하던 것)
    clear_rollout_margin: 0.04
    edge_guard: true         # 11/12: 바깥 차로에서 바깥쪽으로 향해 노란선을 넘을 것 같으면 안쪽으로 끝까지 꺾음
    edge_margin: 0.05
    edge_look: 0.35
    edge_from: 0.70
    yellow_cam_guard: true   # 11/14: 카메라 노란 실선 경계 감지 시 즉시 안쪽 최대 조향
    yellow_cam_offset_mm: 70.0   # (yellow_cam_body false일 때만)
    yellow_cam_body: true    # 11/14 밤: 카메라 노란선 지킴을 '차체 앞 모서리'가 노란선에 닿을 때만 (카메라 행 옆 위치로 판단해
                             #   바깥 차로로 비스듬히 들어갈 때 끝까지 꺾기 <-> 회피 조향이 번갈아 좌우 지그재그. 시뮬레이션 지킴<->회피 64 -> 5)
    yellow_cam_half: 0.25
    outer_entry_lookahead: 0.55  # 11/15: 바깥 차로(1·3차로)로 옮기는 마지막 반 칸은 전방 주시 0.55 m로 완만하게 (노란 실선 밟음 방지). 0 = 끔
    squeeze_target_only: true  # 11/14 밤 '차로를 정했으면 그 차로로': 막혀 끝까지 꺾기·라이다 빈 길 찾기(creep_search)는 정한 차로 쪽으로만
    squeeze: true            # 11/12: 막히면 먼저 조향 끝까지 꺾어 빠짐 (앞뒤 왔다갔다 대신)
    squeeze_min_dist: 0.10   # 11/12 밤 0.2 -> 0.1: 끝까지 꺾은 길로 0.1 m 안에 안 부딪히면 꺾어서 감 (후진 없음)
    squeeze_speed: 0.20   # 11/12 밤: M7 속도 0.20 (0.10 -> 0.20)
    path_margin: 0.02        # 위 판단에서 차체 둘레 여유
    path_rollout: true       # 위 판단의 길 = 목표 차로로 가다 똑바로 서는 실제 조향 (false: 지금 꺾은 그대로 0.3 m)
    emerg_lane_band: true    # 범퍼 앞 비상은 지금 차로~가려는 차로 안 점만 (1->2차선 중 3차선 장애물로 안 섬)
    emerg_min_pts: 2         # 범퍼 앞 비상 박스에 라이다 점이 이만큼 있어야 비상 (점 하나 튀어서 서는 것 방지)

    # ── 제어 (4단계에서 튜닝) ──
    v_cruise: 0.20   # 11/12 밤: M7 속도 0.20 (0.10 -> 0.20)
    v_change: 0.20   # 11/12 밤: M7 속도 0.20 (0.10 -> 0.20)
    lookahead: 0.35   # 11/12 0.40 -> 0.35: 더 크게 꺾어 확 피함 (0.30은 속도 0.3과 같이 쓰면 코너 끝 켤 때 이탈)
    min_turn_radius: 0.53    # 최소 회전반경 실측값
    max_heading_deg: 40.0
    # 11/12 밤: 지금 차로·가려는 차로 앞 장애물이 1.6 m 넘게 멀면 작은 각(최대 30°, 전방 주시 0.6 m)으로 미리 옮김.
    #   가까워지면 위 40°·0.35 m로 크게 꺾음. 크게 틀면 카메라가 선을 놓치고 사각지대가 커지던 것
    gentle: false            # 시뮬레이션에서 오히려 나빠져 끔 (각을 묶으면 비스듬한 채 더 오래 감). 실험용으로만 남김
    gentle_free: 1.6
    gentle_lookahead: 0.60
    gentle_heading_deg: 30.0
    reach_tol: 0.08

    # ── 정렬 보정: 정차 LIMO 중심이 차선 중심에 오도록 내 좌표를 돌리고 옮김 (출발 방향 오차 보정) ──
    lane_align: true
    align_gain: 0.5
    align_sigma_meas: 0.03
    align_sigma_dy: 0.05
    align_sigma_heading_deg: 2.0
    align_max_dy: 0.12
    align_max_heading_deg: 6.0
    align_w_min: 0.14
    align_w_max: 0.32
    align_min_span: 0.8      # 방향 보정은 앞뒤로 0.8 m 넘게 떨어진 장애물들로만 (붙어 있으면 옆 위치만. 15cm 간격 2대로 6° 틀어져 이탈했음)
    align_max_psi_deg: 15.0  # 후진(탈출) 중이거나 15° 넘게 비틀어져 있으면 정렬 안 함
    align_skip_with_camera: true   # 11/12: 카메라 차선 보정이 한 번이라도 되면 장애물 정렬 보정 끔 (비켜 선 LIMO로 방향이 6° 틀어져 앞뒤 반복하던 것)

    # ── 카메라 차선 보정 (11/09): 팀 lane_node /lane/status 로 옆 위치·방향 보정 (차선 코드 복사 아님, 같은 결과 사용) ──
    lane_fix: true
    lane_fix_gain: 0.30      # 한 번에 옆 오차의 이만큼 반영 (11/10 0.15 -> 0.30)
    lane_fix_heading_gain: 0.2   # (11/10 0.1 -> 0.2)
    lane_id_fix: true        # 차선 노드 선 종류(노란 실선/흰 점선)로 본 차로 번호가 5/7번 같으면 그 차로로 위치 옮김
    lane_id_window: 7
    lane_id_need: 5
    lane_keep_blend: 1.0     # 차로 안 직진: 조향 = 팀 차선 주행과 똑같이 v x kappa (/lane/status, 양쪽 선 보이고 같은 차로일 때)
    lane_keep_blend_single: 0.7   # 11/12 밤: 차로 안에서 한쪽 선만 보여도 차선 노드 조향을 70% (차선 인식 우선)
    lane_blend_max_psi_deg: 8.0   # 11/14 밤: 차선 노드 조향 섞기는 차가 8° 안으로 펴진 뒤에만 (비스듬한 채 섞으면 차선 노드와 회피 조향이 번갈아 이김)
    lane_fix_commit: true    # 11/14 밤: 차로 옮기는 중엔 카메라로 위치를 안 고침 (정한 차로로 끝까지, 도착하면 다시 고침)
    lane_blend_tol: 0.12     # 11/15: 차선 조향을 섞는 범위 목표 차로 중심 8 -> 12 cm (M7에서 차선을 거의 안 보던 것, 위치 추정 오차 몫)
                             #   (11/10 0.5 -> 1.0. 차로 바꾸는 중·한쪽 선만 보일 때는 회피 조향)
    lane_fresh_sec: 0.3
    lane_fix_gate: 0.15      # 지금 추정과 15 cm 넘게 다르면 다른 차로를 본 것 → 안 씀
    lane_fix_max_deg: 10.0   # 차선 방향이 10° 넘게 보이면 안 씀 (차로 변경 중, 3차선 입구 사선)
    lane_fix_while_changing: true   # 11/12: 옮기는 중·10~20° 틀어져도 양쪽 선이 보이면 반만 반영 (늘 차선 인식)
    lane_fix_change_deg: 20.0
    lane_fix_change_scale: 0.5
    lane_fix_check_types: true   # 11/14: 선 색이 지금 차로와 맞을 때만 보정 (1차선=왼쪽 노랑·오른쪽 흰). 트랙 밖 바닥을 흰 선으로 본 가짜 차로로 끌려가던 것 (1114_02)
    outside_fix: true            # 11/14: 바깥 차로인데 안쪽 선이 노란 실선으로 3프레임 = 노란선 밖 -> 옆 위치를 노란선 바깥 5cm로 옮겨 안쪽으로 돌아옴
    outside_frames: 3
    outside_max_deg: 25.0
    outside_margin: 0.05
    lane_row: 0.55           # 차선 노드 offset 을 재는 행 (기준점 앞 m)

    # ── 멈춤 탈출 (11/09): 막혀서 0.8초 서 있으면 0.25 m 후진하며 크게 꺾어 다시 계획 (최대 3번) ──
    recover: true            # 11/14: 다시 켬 (팀 결정). 막히면 먼저 끝까지 꺾어 빠지기(squeeze), 그래도 막혀 0.4 s 서 있으면 온 길 되돌아가기(trail) -> 탈출(swing)
                             #   (11/12 밤에 끈 이유였던 '옆 장애물을 앞으로 세서 후진'은 clear_rollout으로 고침)
    recover_after: 1.5       # 11/15 저녁 0.4 -> 1.5: 막혀도 바로 후진하지 않고 먼저 지금 라이다로 빈 쪽 전진(똑바로 바로, 양쪽은 1초 뒤)을 찾은 뒤 후진
    recover_dist: 0.40   # 11/12 0.25 -> 0.40
    recover_speed: 0.20   # 11/12 밤: M7 속도 0.20 (0.10 -> 0.20)
    recover_time: 6.0      # 0.1 m/s로 0.4 m 후진하려면 4초 -> 여유 있게 6초
    recover_max: 3           # trail(온 길 되돌아가기) 횟수
    recover_swing_max: 6     # trail을 다 쓰고도 막히면 후진+최대 조향으로 머리를 빈 쪽으로 (같은 쪽 2번 실패하면 반대쪽). 0이면 예전처럼 정지
    recover_mode: trail      # trail: 막히면 온 길 그대로 후진, 갈 차로(틀 공간 포함)가 생기면 멈추고 그리로 / swing: 예전
    trail_step: 0.05
    rollback_lookahead: 0.30
    rollback_reverse_scale: 0.10  # 11/14: 기억후진 시 원래 꺾었던 조향의 반대 방향 10% 조향
    rollback_max_dist: 0.60   # 11/12 0.3 -> 0.4, 11/14 0.4 -> 0.6 (1114_02: 0.4는 두 번 다 '갈 길 없음')
    recover_lookahead: 0.20   # 11/12 0.25 -> 0.20: 후진 뒤 최소 회전반경까지 꺾음
    rollback_time: 15.0
