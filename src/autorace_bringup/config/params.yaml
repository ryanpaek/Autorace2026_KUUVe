# Autorace 2026 파라미터. 숫자는 소수점까지 쓸 것 (0.3, 650.0).
# 실행 중 바꾸기: ros2 param set /lane_node lookahead_mm 600.0
# TODO 표시는 실측해서 채울 값이다.

lane_node:
  ros__parameters:
    image_topic: /camera/color/image_raw   # TODO 첫날 ros2 topic list로 확인
    imu_topic: /imu
    require_calibration: true              # BEV yaml이 calibrated:false면 정지 명령만
    base_speed: 0.30
    min_speed: 0.08                        # TODO 실측: 이보다 느리면 차가 안 움직이는 속도
    publish_debug: true
    debug_every: 3
    lane_mask_source: hsv                  # 학습한 분할 모델을 쓰려면 model
    seg_model_path: '/home/wego/autorace_ws/models/lane_seg_1031.onnx'   # 10/31 학습 (2클래스). 쓰려면 lane_mask_source: model
    seg_threshold: 0.5
    lane_color: yellow                     # 모의 맵 차선 노란색 확인 (10/30). 정지선은 흰색 마스크로 따로 찾음
    white_v_min: 180
    white_s_max: 60
    yellow_h_min: 15
    yellow_h_max: 40
    yellow_s_min: 80
    yellow_v_min: 80
    lane_width_mm: 515.0                   # 모의 맵 실측(10/30): 바깥~바깥 535, 테이프 20 -> 중심 간 515
    lookahead_mm: 650.0
    kappa_max: 2.1                         # 최소 회전반경 약 0.46m(가상 바퀴 0.41rad) -> 1/0.46
    kappa_alpha: 0.5
    kappa_rate_max: 0.6
    lost_hold_frames: 30
    # 11/11: 차선을 놓쳤을 때(hold) 조향을 IMU 방향 유지(직진) 대신 도면 곡률 쪽으로 이만큼 섞는다.
    # 코너에서 차선을 놓치면 직진해 경로를 벗어나던 문제. 미션 노드가 길 잃음(lost)이면 안 섞음. 0이면 예전처럼 직진
    route_ff_weight_lost: 0.8
    yaw_kp: 1.5
    curve_slowdown: 0.3

mission_node:
  ros__parameters:
    start_state: WAIT_START                # LANE_ONLY, M3_PEDESTRIAN 등으로 바꿔 미션만 연습
    odom_topic: /odom                      # TODO 드라이버에 따라 /wheel/odom
    imu_topic: /imu
    tick_hz: 20.0
    max_speed: 0.45
    base_speed: 0.30
    slow_speed: 0.20                       # 서행 (규정 최대 0.2, 11/09 팀 결정)
    approach_speed: 0.18
    det_conf: 0.5
    bump_slow_mm: 2500.0                   # 방지턱을 IMU로 못 느꼈을 때 서행 최대 거리 (2순위). 표지를 선 1m 앞에서 봐도 방지턱(위치 미상)까지 덮게. TODO 실측
    bump_imu_rate: 0.30                    # IMU 기울기 속도(rad/s)가 이 이상이면 방지턱. TODO 실측 (손으로 넘겨 보며 확인)
    bump_after_mm: 300.0                   # 방지턱 느낀 뒤 이만큼 더 가서 서행 끝 (뒷바퀴까지)
    zigzag_start_mm: 7200.0                # 도면 기준 (긴 거리, 선 검출로 교체 권장)
    zigzag_width_mm: 570.0
    zigzag_len_mm: 1800.0
    leave_mm: 600.0
    state_max_mm: 10000.0
    stop_brake_mm: 30.0                    # TODO 실측
    ped_wait_sec: 3.5
    obstacle_source_ready: false           # obstacle 노드 완성 후 true
    m7_len_mm: 6000.0                      # 도면 기준, 모의맵 실측으로 확인
    m7_external_avoid: false               # launch의 m7_avoid:=true가 켬 (limo_obstacle_avoid로 회피)
    m7_force_after_island_mm: 500.0        # 회피가 안 끝나도 섬 끝 + 이만큼에서 M2로
    fork_from_m7_exit: true                # 갈림길 표지를 못 읽으면 회피가 끝난 차로를 씀
    fork_follow_m7_exit: true              # 표지와 회피 차로가 다를 때 true=차로를 따름 (11/11: M2 시작 때 이미 섬 옆이라 건너갈 수 없음)
    cones_len_mm: 4300.0                   # cones_source_ready=false일 때만 씀 (차선 주행 통과 거리)
    # M8 라바콘: obstacle 노드가 콘 사이 경로를 따라감. false로 바꾸면 예전처럼 차선 주행으로 통과
    cones_source_ready: true
    cones_enter_before_mm: 0.0             # 도면 예비: 시작선 이만큼 앞에서 라바콘 모드 (1순위는 카메라로 선 통과)
    cones_enter_cone_mm: 500.0             # 차로 안 콘이 이 안이면 조금 일찍
    cones_end_after_mm: 150.0              # 끝선 이만큼 지나면 무조건 복귀
    cones_zone_mm: 2700.0
    cones_handover_mm: 400.0
    cones_handover_frames: 4
    cones_gone_mm: 800.0                   # 앞 이 거리 안(구간 폭 안) 콘이
    cones_gone_sec: 0.5                    # 이 시간 동안 0개면 라바콘 끝
    cones_min_mm: 500.0                    # 라바콘 모드로 이만큼 간 뒤부터 끝 판단
    m4_arm_before_mm: 800.0                # 주차 표지 못 봤을 때: 도면상 주차 앞 선 이만큼 앞부터 주차 노드가 선을 받음
    fork_len_mm: 2300.0                    # 도면 기준, 모의맵 실측으로 확인
    fork_default: A
    stop_on_green_arrival: true
    # 도면 경로 지도 (route_file은 launch가 config/track_route.yaml로 넣어 줌)
    route_gate_mm: 250.0                   # 흰 선을 도면 선으로 인정하는 오차 (달린 거리만큼 넓어짐)
    route_gain: 0.6
    odom_scale: 1.0                        # TODO 실측: 직선 3m 주행 -> 실제 거리 / /odom 거리
    route_signed_dist: true                # 후진 거리는 경로 위치에서 뺌. 후진 판단: odom 속도 부호 / odom 위치 변화 방향 / 최근 /cmd_vel 중 하나라도 (11/11)
    route_project_heading: true            # 차가 경로와 비스듬히 간 거리는 cos(방향 차)만 s에 (지그재그 과대 측정 줄임), 나머지는 좌우 d로 (11/11)
    route_align_on_reset: true             # 출발선·연습 시작점·/route/set_s에서 차가 경로 방향으로 반듯이 놓였다고 보고 방향 맞춤
    route_lost_misses: 2                   # 도면 선을 연속 2개 못 보고 지나치면 길 잃음 -> FSM은 표지·카메라·거리로만 (0 = 끔)
    route_anchor_max_mm: 3000.0            # 카메라로 확인한 미션 선으로 위치 다시 맞출 때 최대 허용 차이

obstacle_node:
  ros__parameters:
    scan_topic: /scan
    odom_topic: /odom
    imu_topic: /imu
    image_topic: /camera/color/image_raw   # 콘 색 확인용 (bev_config는 launch가 넣어 줌)
    laser_x_mm: 100.0                      # TODO 실측: 뒤차축 -> 라이다 중심 (docs/m8_cones.md 1번)
    laser_yaw: 0.0                         # TODO 확인: 2도만 틀려도 콘 여유가 15mm 넘게 줆
    lane_centers_y: [500.0, 0.0, -500.0]
    lane_half_width: 230.0
    # M8 라바콘 (cone_core.ConeFollower). 속도는 cones.speed (예전 cone_speed는 안 씀)
    camera_check: true
    cam_orange_min: 0.12
    m8_axis_track_deg: 90.0                # 라바콘 구간 = 좌측 직선 북쪽 방향 (도면)
    cones:                                 # 라바콘 (cone_core.ConeParams). 이름 앞에 cones. 붙여 param set
      speed: 0.15
      lookahead_mm: 260.0                  # 시뮬레이션 220~300 좋음. 지그재그 흔들리면 늘리기
      cone_scan_radius_mm: 30.0            # TODO 실측: 라이다 높이에서 콘 단면 반지름
      cone_base_radius_mm: 50.0            # TODO 실측: 콘 바닥 반지름
      lidar_fov_deg: 240.0                 # 라이다 시야 (뒤쪽 가림). 지나간 콘은 기억으로 유지
      cone_min_range_mm: 120.0             # 이보다 가까운 점은 차체로 보고 버림
      car_half_width_mm: 115.0
      clear_margin_mm: 40.0
      corridor_width_mm: 500.0             # 쌍을 못 찾을 때 가정하는 통로 폭 (콘 중심 간)
      single_tie_side: right               # 가운데 놓인 콘 하나는 오른쪽으로 비켜 감
      zone_half_width_mm: 650.0
      done_margin_mm: 150.0
    # M7 연결 (m7_link.py). 시작선·섬 위치는 track_route.yaml 기준 (test_m7_link가 확인)
    m7_avoid_node: /avoid_node
    m7_start_s_mm: 13589.0
    m7_island_s_mm: 17973.0
    m7_enable_at_mm: 0.0                   # 앞바퀴가 시작선 + 이만큼에서 회피 시작
    m7_max_heading_deg: 3.0                # 차선 방향이 이보다 틀어져 있으면 켜기를 미룸
    m7_heading_wait_mm: 300.0              # 그래도 시작선 + 이만큼에선 켬
    m7_fork_fallback: auto                 # 켤 때까지 갈림길 표지를 못 읽으면: auto | A | B
    # M7 켜기 (11/09): 횡단보도를 벗어나면 라이다로 앞 차로 감시 -> 장애물이 가까워지면 켬. 예전 방식: line
    m7_enable_mode: obstacle               # obstacle | line(시작선 흰 선)
    m7_trigger_front_mm: 1000.0            # 라이다 -> 앞 차로 장애물이 이 안이면 켬. 11/11 m7_trigger_sim: 700/850/1000 모두 40/40,
                                           #   700은 거친 조건에서 후진 판이 조금 더 많음 (20 vs 15). 700으로 써도 됨
    m7_trigger_half_width_mm: 200.0        # 앞 차로 폭 (차 중심 ±). 옆 차로 LIMO는 안 들어옴
    m7_trigger_gate_mm: -250.0             # 시작선 기준 이 위치부터 (코너 안에서 켜지지 않게, 코너 끝 = -288)
    m7_trigger_gate_early_mm: 300.0        # 카메라 양쪽 선이 곧으면(코너 벗어남) 문턱 -300부터. 도면 위치가 늦게 잡혀 늦게 켜지는 것 방지
                                           #   (11/11 시뮬레이션: 도면 -0.3 m면 앞 617 mm에서 켬·충돌 3 -> 914 mm·충돌 0)
    m7_trigger_fallback_mm: 1000.0         # 앞 차로에 장애물이 끝까지 없으면 시작선 + 이만큼에서 켬
    # M7 끄기 (11/09): YOLO 갈림길 표지를 확인한 뒤 지나가면 끔. 예전 방식만: none
    m7_off_mode: sign                      # sign | none (none이어도 회피 노드 자체 종료·FSM 강제 종료는 그대로)
    m7_active_timeout_sec: 1.0             # 회피 노드 /avoid/active가 이만큼 끊기면 정지 (0.5 -> 1.0: 바쁜 CPU에서 잠깐 늦는 것까지 멈췄음)
    m7_hold_resume: true                   # 끊김으로 멈췄다가 active가 다시 오면 풀고 계속 (Ctrl+C로 놓은 것은 계속 정지)
    m7_off_sign_classes: [fork_a, fork_b]
    m7_off_sign_conf: 0.5
    m7_off_sign_window: 5
    m7_off_sign_need: 3                    # 최근 5프레임 중 3번 보이면 '표지 확인'
    m7_off_sign_lost_frames: 5             # 확인한 뒤 5프레임 연속 안 보이면 '지나감' -> 끔
    m7_off_sign_near_h_px: 0.0             # 표지 상자 높이가 이 이상이면 바로 끔 (0 = 안 씀, 실차로 정할 것)
    m7_off_gate_mm: 1500.0                 # 섬 앞 끝 1.5 m 안에서만 (멀리서 LIMO에 가려 사라지는 오판 방지)
    m7_off_sign_edge_px: 10.0              # 표지 상자가 화면 좌우 끝 10 px 안에 닿은 뒤 사라지면 '화면 밖으로 나감' = 지나감 (0 = 안 씀)
    m7_off_sign_edge_frames: 2             #   그 뒤 2프레임 연속 안 보이면 (한 번 놓친 것과 구분)
    m7_off_sign_img_w: 640.0
    m7_off_sign_after_mm: 400.0            # 지나감을 안 뒤 이만큼 더 가서 끔. 실차: 로그 '표지가 화면 옆으로 나감' 위치를 보고 맞춤

detector_node:
  ros__parameters:
    image_topic: /camera/color/image_raw
    model_path: '/home/wego/autorace_ws/models/autorace_yolo_v3.onnx'
    class_names: [red, yellow, green, fork_a, fork_b, pedestrian, bump, slow, parking]   # v3 모델 ID 순서
    input_size: 640
    conf_threshold: 0.5
    # 11/09: 스레드 제한 없이 10Hz로 돌리면 실제 1.8Hz + 차선 노드 절반 속도. 2스레드·5Hz로 제한
    infer_hz: 5.0
    ort_threads: 2

class_command_node:
  ros__parameters:
    detections_topic: /perception/detections
    commands_topic: /perception/commands
    mission_topic: /mission/state          # state + route.last_fix/fixes 재사용
    context_timeout_sec: 1.0               # 구간/바닥 확인 유효 시간 (수신 후 단조 시계)
    conf_threshold: 0.5
    vote_window: 10                        # 최근 새 검출 프레임 10개
    vote_need: 7                           # 그중 7개 이상 검출 시 해당 명령 발행
    # 미션별 투표 기준 (최근 vote_window 프레임 중 몇 번). 0 = 위 vote_need. 제안값, TODO bag으로 조정
    #   잘못 보면 되돌릴 수 없는 것(갈림길 A/B는 한 번 정하면 안 바뀜, 신호등)은 엄하게
    #   놓치는 손해가 더 큰 것(서행·방지턱, 주차)은 느슨하게
    mode_vote_need.M1_TRAFFIC: 7                # 신호등 빨강/초록 (+ 보행자)
    mode_vote_need.M2_FORK: 7                   # 갈림길 A/B
    mode_vote_need.M7_OBSTACLE: 7               # 3차선에서 미리 보는 갈림길 A/B
    mode_vote_need.M3_PEDESTRIAN: 6             # 보행자: 잘못 보면 엉뚱한 선에 설 수 있어 중간
    mode_vote_need.M4_PARKING: 5                # 주차: 주차 노드가 선·리모 짝으로 다시 확인
    mode_vote_need.M5_BUMP: 5                   # 서행·방지턱: 잘못 봐도 시간만 조금 손해
    mode_vote_need.M6_ZIGZAG: 0                 # (받는 표지 없음)
    mode_vote_need.M8_CONES: 0                  # (받는 표지 없음)
    yellow_action: none                    # none: 명령 없음, pause: 정지선 앞 정지 요청
    # 원본 영상 bbox 높이(px). 0=크기 필터 끔. 현장 시험 후 클래스별 조정.
    min_bbox_height_px.red: 0.0
    min_bbox_height_px.yellow: 0.0
    min_bbox_height_px.green: 0.0
    min_bbox_height_px.fork_a: 0.0
    min_bbox_height_px.fork_b: 0.0
    min_bbox_height_px.pedestrian: 0.0
    min_bbox_height_px.bump: 0.0
    min_bbox_height_px.slow: 0.0
    min_bbox_height_px.parking: 0.0

parking_node:
  ros__parameters:
    odom_topic: /odom
    imu_topic: /imu
    scan_topic: /scan
    enabled: false                         # 실차 시험 전까지 false (docs/CHANGES_20261109_parking.md 순서대로 확인 후 true)
    # ---- 실측 필요 (TODO): tools/parking_scan_check.py, 줄자. 기본값은 추정
    front_axle_from_lidar_mm: -47.0        # 라이다 -> 앞바퀴 축 앞뒤 거리, 앞 +. 라이다가 47mm 앞이면 -47 (calib 5번 해석)
    front_bumper_from_axle_mm: 56.0        # 앞바퀴 축 -> 앞범퍼
    body_center_from_rear_mm: 105.0        # 뒷바퀴 축 -> 차체 중심 (오버행 앞뒤 같다고 가정)
    laser_yaw: 0.0                         # 라이다 정면 각도 보정 (rad)
    target_offset_mm: 50.0                 # 흰 선 뒤 차로 중심에서 왼쪽으로 (왼쪽 차선과 약 8cm, 차로 안쪽 폭 480 가정)
    # ---- 두 리모 중점 / 꺾기 (도면·calib 근거, 바꿀 일 적음)
    target_row: front                      # 들어갈 줄 고정 (11/10 대회 배치 = 2번). back = 5번, auto = 짝 줄로 판단
    pair_trigger: true                     # 흰 선을 못 봐도 오른쪽 1·3번 짝을 연속으로 보면 주차 시작 (주차 표지/armed일 때만)
    pair_trigger_frames: 3
    pair_dist_mm: 1040.0                   # 정차 리모 두 대 사이 = 칸 2개 (500 + 20 + 500 + 20)
    turn_lead_mm: 320.0                    # 칸 가운데가 앞바퀴보다 이만큼 앞일 때 꺾기 (회전반경 530 - 축거 210)
    straighten_yaw_deg: 87.0               # 이만큼 돌면 바퀴 펴기 (정지 후 2~4도 더 돎, calib 3번)
    max_realign: 2                         # 재정렬 최대 횟수 (0 = 끔). 1번에 약 10초
    follow_col5: true                      # 꺾은 뒤 정면 5번 리모로 2번 칸 세로 가운데선 구해서 따라가기 (11/10)
    side_guard_mm: 50.0                    # 꺾는 중·들어가는 중 리모까지 이보다 가까우면 멈추고 재정렬. 0 = 끔
    final_head_tol_deg: 4.0                # 끝 정렬: 방향이 이보다 틀어지면 한 번 더 (시간이 아까우면 크게)
    final_lat_tol_mm: 30.0                 # 끝 정렬: 차체 중심이 칸 가운데에서 이보다 벗어나면 한 번 더
    pullout_steer: true                    # 재정렬 후진 때 (앞범퍼가 옆 리모를 지난 뒤) 꺾으며 후진
    pullout_mm: 500.0                      # 재정렬 후진 거리. 650이면 왼쪽 노란 선 밟음 (11/11 실차, 시뮬레이션 -0.8cm). 500 = 여유 약 10cm
    pause_sec: 0.3                         # 꺾기 전 정지 (1.0 -> 0.3, 11/11). 0.18m/s 제동 약 0.26초
