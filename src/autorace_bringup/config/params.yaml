# Autorace 2026 파라미터. 숫자는 소수점까지 쓸 것 (0.3, 650.0).
# 실행 중 바꾸기: ros2 param set /lane_node lookahead_mm 600.0
# TODO 표시는 실측해서 채울 값이다.

lane_node:
  ros__parameters:
    image_topic: /camera/color/image_raw   # TODO 첫날 ros2 topic list로 확인
    imu_topic: /imu
    require_calibration: true              # BEV yaml이 calibrated:false면 정지 명령만
    base_speed: 0.30
    min_speed: 0.08                        # TODO 실측: 이보다 느리면 차가 안 움직이는 속도
    publish_debug: true
    debug_every: 3
    lane_mask_source: hsv                  # 학습한 분할 모델을 쓰려면 model
    seg_model_path: '/home/wego/autorace_ws/models/lane_seg_1031.onnx'   # 10/31 학습 (2클래스). 쓰려면 lane_mask_source: model
    seg_threshold: 0.5
    lane_color: yellow                     # 모의 맵 차선 노란색 확인 (10/30). 정지선은 흰색 마스크로 따로 찾음
    white_v_min: 180
    white_s_max: 60
    yellow_h_min: 15
    yellow_h_max: 40
    yellow_s_min: 80
    yellow_v_min: 80
    lane_width_mm: 515.0                   # 모의 맵 실측(10/30): 바깥~바깥 535, 테이프 20 -> 중심 간 515
    lookahead_mm: 650.0
    kappa_max: 2.1                         # 최소 회전반경 약 0.46m(가상 바퀴 0.41rad) -> 1/0.46
    kappa_alpha: 0.5
    kappa_rate_max: 0.6
    lost_hold_frames: 30
    # 11/11: 차선을 놓쳤을 때(hold) 조향을 IMU 방향 유지(직진) 대신 도면 곡률 쪽으로 이만큼 섞는다.
    # 코너에서 차선을 놓치면 직진해 경로를 벗어나던 문제. 미션 노드가 길 잃음(lost)이면 안 섞음. 0이면 예전처럼 직진
    route_ff_weight_lost: 0.8
    yaw_kp: 1.5
    curve_slowdown: 0.3
    # 11/14: 노란 실선은 절대 이탈하면 안 되는 트랙 바깥 경계선 -> 접근 시 안쪽으로 강하게 조향
    yellow_solid_guard: true
    yellow_guard_margin_mm: 200.0
    yellow_guard_hard_mm: 140.0
    yellow_guard_gain: 2.0
    yellow_guard_one_side_only: true       # 11/15: 양쪽이 다 노란 실선(일반 구간)이면 지킴 안 함 (직선에서 좌우로 왔다갔다 원인). M7 바깥 차로만
    yellow_guard_three_lane_only: true     # 11/15: 지킴은 M7 3차선에서만. 코너 앞(바깥 선이 앞쪽에서 휘어 들어옴)·M2 한쪽 선 모드에서 '붙었다'로 착각해 과하게 꺾던 것
    corner_kappa_gain: 1.1                 # 11/15: 차선이 커브라고 할 때(|곡률|>0.6) 조향 1.1배 (커브마다 아슬아슬). 코너 시뮬레이션: 바깥 36 -> 26 mm, 안쪽 112 -> 120 mm(선까지 17 mm). 1.2면 안쪽 여유 10 mm

mission_node:
  ros__parameters:
    start_state: WAIT_START                # LANE_ONLY, M3_PEDESTRIAN 등으로 바꿔 미션만 연습
    odom_topic: /odom                      # TODO 드라이버에 따라 /wheel/odom
    imu_topic: /imu
    tick_hz: 20.0
    max_speed: 0.45
    base_speed: 0.30
    slow_speed: 0.20                       # 서행 (규정 최대 0.2, 11/09 팀 결정)
    approach_speed: 0.18
    m7_speed: 0.20                         # 11/12 밤: M7 전체(코너 차선 주행 + 회피 노드 avoid_params.yaml) 0.20
    m7_lookahead_mm: 400.0                 # 11/17 밤 450 -> 400: 차로 바꾼 뒤 지금 차로에 더 빨리 붙게 (시뮬레이션: 15 cm 벗어남 -> 3 cm 안 0.86 -> 0.78 m, 넘침 1.5 cm)
    det_conf: 0.5
    bump_slow_mm: 2500.0                   # 방지턱을 IMU로 못 느꼈을 때 서행 최대 거리 (2순위). 표지를 선 1m 앞에서 봐도 방지턱(위치 미상)까지 덮게. TODO 실측
    bump_imu_rate: 0.30                    # IMU 기울기 속도(rad/s)가 이 이상이면 방지턱. TODO 실측 (손으로 넘겨 보며 확인)
    bump_after_mm: 300.0                   # 방지턱 느낀 뒤 이만큼 더 가서 서행 끝 (뒷바퀴까지)
    zigzag_start_mm: 7200.0                # 도면 기준 (긴 거리, 선 검출로 교체 권장)
    zigzag_width_mm: 570.0
    zigzag_len_mm: 1800.0
    leave_mm: 600.0
    state_max_mm: 10000.0
    stop_target_mm: 150.0                  # 11/15 저녁: 100으로도 실차는 정지선 직전에 섬 -> 150. 실행 중 바로 바꾸기: ros2 param set /mission_node stop_target_mm 200.0
    m3_stop_target_mm: 250.0               # 11/15 저녁: M7 직전 횡단보도는 여유롭게 25 cm 앞 (실행 중 ros2 param set /mission_node m3_stop_target_mm ...)
    stop_passed_mm: 120.0                  #   정지선을 이만큼 지났다고 보이면 그 자리에서 정지 (끝선까지 가서 서던 것)
    m3_pretrack: true                      # 11/15 밤: 지그재그 중에 횡단보도 정지선을 미리 재 둠 (M3 시작 땐 정지선이 이미 카메라 사각이라 지나서 섰음)
    stop_brake_mm: 30.0                    # TODO 실측
    ped_wait_sec: 3.5
    obstacle_source_ready: false           # obstacle 노드 완성 후 true
    m7_len_mm: 6000.0                      # 도면 기준, 모의맵 실측으로 확인
    m7_external_avoid: false               # launch의 m7_avoid:=true가 켬 (limo_obstacle_avoid로 회피)
    m7_force_after_island_mm: 1500.0       # 회피가 안 끝나도 섬 끝 + 이만큼에서 M2로. 11/17 500 -> 1500: M2 갈림길 녹화 재생이 섬 지나서까지 M7 안에서 돎
    fork_from_m7_exit: true                # 갈림길 표지를 못 읽으면 회피가 끝난 차로를 씀
    fork_follow_m7_exit: true              # 표지와 회피 차로가 다를 때 true=차로를 따름 (11/11: M2 시작 때 이미 섬 옆이라 건너갈 수 없음)
    cones_len_mm: 4300.0                   # cones_source_ready=false일 때만 씀 (차선 주행 통과 거리)
    # M8 라바콘: obstacle 노드가 콘 사이 경로를 따라감. false로 바꾸면 예전처럼 차선 주행으로 통과
    cones_source_ready: true
    m2_exit: true                          # 11/14: M2_EXIT 상태(합류 끝 ~ 라바콘 시작선) = 차선 인식 모드만 + 코너 도면 곡률 보조. false면 예전(M8 접근에서 한쪽 선 모드)
    m8_keep_fork_mm: 2500.0                # 11/12 밤: M2에서 넘어오면 한쪽 선 모드를 코너를 다 돌 때까지 유지 (합류~코너 앞: 갈림길 바깥선, 코너: 안쪽 선=right_only). 이 거리는 안전 상한, 0=끔
    m8_both_frames: 0                      #   >0이면 양쪽 선이 이만큼 연속 보일 때 바로 normal (끝까지 한쪽 선 -> 0)
    m8_hold_speed: 0.15                    #   그동안 속도 (M7 직전 코너처럼 코너에서 직진하지 않게 천천히)
    fork_lane_width_mm: 460.0              # 11/12 밤: M2·합류 한쪽 선 모드 차로 폭 (바깥선에서 230 mm). 섬 쪽 선을 밟고 들어가던 것 -> 바깥선 쪽으로
    fork_lost_search: true                 #   M7 차선 구간·M2·합류에서 선을 놓치면 직선 방향으로 풀고 좌우 30° 찾기 (서서 끝내지 않음)
    m8_corner_k_gain: 1.0                  # 11/14: 1.15 -> 1.0 (R557은 코너 안쪽 노란 선을 밟고 출구에서 차선 이탈 유발 -> R640 그대로)
    cones_line_camera_first: true          # 11/16: 라바콘 시작선 = 카메라로 본 흰 가로선 통과 (도면과 달라도 같은 선 3프레임 연속이면)
    cones_enter_before_mm: 0.0             # 도면 예비: 시작선 이만큼 앞에서 라바콘 모드 (1순위는 카메라로 선 통과)
    cones_enter_cone_mm: 150.0             # 11/14 밤: 400 -> 150 원복 (d4d4c70 라바콘 변경 되돌림, 실차 '라바콘 인식 못 함')
    cones_corner_close_mm: 0.0             # 11/14 밤: 250 -> 0 = 끔 (d4d4c70 원복)
    cones_corner_min_deg: 70.0
    cones_end_after_mm: 150.0              # 끝선 이만큼 지나면 무조건 복귀
    cones_zone_mm: 2700.0
    cones_handover_mm: 400.0
    cones_handover_frames: 4
    cones_gone_mm: 800.0                   # 앞 이 거리 안(구간 폭 안) 콘이
    cones_gone_sec: 0.5                    # 이 시간 동안 0개면 라바콘 끝
    cones_min_mm: 500.0                    # 라바콘 모드로 이만큼 간 뒤부터 끝 판단
    m4_arm_before_mm: 800.0                # 주차 표지 못 봤을 때: 도면상 주차 앞 선 이만큼 앞부터 주차 노드가 선을 받음
    m4_direct: true                        # 11/12: M4 들어오자마자 주차 노드에 넘김 (표지·도면 위치 안 기다림). 주차 노드 skip_wait_line과 같이
    m4_target_offset_mm: 50.0              # 11/12: 주차 노드에 넘긴 뒤 차선 왼쪽 5cm 붙기 (주차 노드 publish_lane_cfg: false와 같이)
    fork_len_mm: 2300.0                    # 도면 기준, 모의맵 실측으로 확인
    fork_default: A
    floor_need_exit_agree: true            # 11/15: 회피가 끝난 차로(A/B)를 알면 바닥 글자가 같을 때만 씀 (1차선으로 들어갔는데 글자 잘못 읽어 B 쪽 선을 따라가 합류에서 탈선). false = 바닥 글자 우선
    stop_on_green_arrival: false           # 11/14: 도착 때 초록이 확정돼 있으면 서지 않고 통과 (빨강·아무것도 못 봤으면 정지선에서 서서 초록 기다림)
    # 도면 경로 지도 (route_file은 launch가 config/track_route.yaml로 넣어 줌)
    route_gate_mm: 250.0                   # 흰 선을 도면 선으로 인정하는 오차 (달린 거리만큼 넓어짐)
    route_gain: 0.6
    odom_scale: 1.0                        # TODO 실측: 직선 3m 주행 -> 실제 거리 / /odom 거리
    route_signed_dist: true                # 후진 거리는 경로 위치에서 뺌. 후진 판단: odom 속도 부호 / odom 위치 변화 방향 / 최근 /cmd_vel 중 하나라도 (11/11)
    route_project_heading: true            # 차가 경로와 비스듬히 간 거리는 cos(방향 차)만 s에 (지그재그 과대 측정 줄임), 나머지는 좌우 d로 (11/11)
    route_align_on_reset: true             # 출발선·연습 시작점·/route/set_s에서 차가 경로 방향으로 반듯이 놓였다고 보고 방향 맞춤
    route_lost_misses: 2                   # 도면 선을 연속 2개 못 보고 지나치면 길 잃음 -> FSM은 표지·카메라·거리로만 (0 = 끔)
    route_anchor_max_mm: 3000.0            # 카메라로 확인한 미션 선으로 위치 다시 맞출 때 최대 허용 차이
    # 11/15 (1114 bag 네 판 위치 분석)
    route_fix_max_dpsi_deg: 15.0           # 차가 경로와 이보다 비스듬하면 흰 가로선으로 s 안 맞춤 (M7: 10°+두 선, M8: 안 씀)
    route_corner_anchor: true              # 90° 코너를 IMU로 다 돈 순간 s = 코너 끝 (M7·M2 뒤 1~2 m 뒤처짐 바로잡기)
    route_corner_window_mm: 3000.0         #   지금 s가 코너 끝에서 이 안일 때만
    route_corner_k_gain: 1.0               # 차선 노드에 주는 도면 코너 곡률 배율 (main의 축거 0.222·corner_kappa_gain 1.1과 겹쳐서 1.0. 필요하면 1.1)
    m7_corner_k_gain: 1.0                  # M7 직전 코너 IMU 곡률 미리보기 배율 (같은 이유로 1.0)
    stop_pretrack: true                    # M6·M1 준비 전부터 횡단보도 정지선을 카메라로 따라감 (정지 1순위 = 카메라 선)
    stop_pretrack_mm: 1500.0               #   도면상 정지선이 이 거리 안일 때부터

obstacle_node:
  ros__parameters:
    scan_topic: /scan
    odom_topic: /odom
    imu_topic: /imu
    image_topic: /camera/color/image_raw   # 콘 색 확인용 (bev_config는 launch가 넣어 줌)
    laser_x_mm: 100.0                      # TODO 실측: 뒤차축 -> 라이다 중심 (docs/m8_cones.md 1번)
    laser_yaw: 0.0                         # TODO 확인: 2도만 틀려도 콘 여유가 15mm 넘게 줆
    lane_centers_y: [500.0, 0.0, -500.0]
    lane_half_width: 230.0
    # M8 라바콘 (cone_core.ConeFollower). 속도는 cones.speed (예전 cone_speed는 안 씀)
    camera_check: false                    # 11/14 밤: true -> false. 대회 라바콘이 흰색이라 '주황 아님'으로 콘을 버려 인식을 못 했음
                                           #   (1114_01 bag도 false로 돌려 거부 0). 주황 콘이면 true
    cam_orange_min: 0.12
    m8_axis_track_deg: 90.0                # 라바콘 구간 = 좌측 직선 북쪽 방향 (도면)
    cones:                                 # 라바콘 (cone_core.ConeParams). 이름 앞에 cones. 붙여 param set
      speed: 0.15
      lookahead_mm: 260.0                  # 시뮬레이션 220~300 좋음. 지그재그 흔들리면 늘리기
      cone_scan_radius_mm: 30.0            # TODO 실측: 라이다 높이에서 콘 단면 반지름
      cone_base_radius_mm: 50.0            # TODO 실측: 콘 바닥 반지름
      lidar_fov_deg: 240.0                 # 라이다 시야 (뒤쪽 가림). 지나간 콘은 기억으로 유지
      cone_min_range_mm: 120.0             # 이보다 가까운 점은 차체로 보고 버림
      car_half_width_mm: 115.0
      clear_margin_mm: 40.0
      corridor_width_mm: 500.0             # 쌍을 못 찾을 때 가정하는 통로 폭 (콘 중심 간)
      single_tie_side: right               # 가운데 놓인 콘 하나는 오른쪽으로 비켜 감
      zone_half_width_mm: 650.0
      done_margin_mm: 150.0
    # M7 연결 (m7_link.py). 시작선·섬 위치는 track_route.yaml 기준 (test_m7_link가 확인)
    m7_avoid_node: /avoid_node
    m7_start_s_mm: 13589.0
    m7_island_s_mm: 17973.0
    m7_enable_at_mm: 0.0                   # 앞바퀴가 시작선 + 이만큼에서 회피 시작
    m7_max_heading_deg: 3.0                # 차선 방향이 이보다 틀어져 있으면 켜기를 미룸
    m7_heading_wait_mm: 300.0              # 그래도 시작선 + 이만큼에선 켬
    m7_fork_fallback: auto                 # 켤 때까지 갈림길 표지를 못 읽으면: auto | A | B
    # M7 켜기 (11/09): 횡단보도를 벗어나면 라이다로 앞 차로 감시 -> 장애물이 가까워지면 켬. 예전 방식: line
    m7_enable_mode: obstacle               # obstacle | line(시작선 흰 선)
    m7_trigger_front_mm: 1800.0            # 11/12 1000 -> 1300 -> 밤 1800 (멀리서 미리, 회피는 1.5에서 차로 변경). 라이다 -> 앞 차로 장애물이 이 안이면 켬. 11/11 m7_trigger_sim: 700/850/1000 모두 40/40,
                                           #   700은 거친 조건에서 후진 판이 조금 더 많음 (20 vs 15). 700으로 써도 됨
    m7_trigger_half_width_mm: 200.0        # 앞 차로 폭 (차 중심 ±). 옆 차로 LIMO는 안 들어옴
    m7_trigger_gate_mm: -250.0             # 시작선 기준 이 위치부터 (코너 안에서 켜지지 않게, 코너 끝 = -288)
    m7_trigger_gate_early_mm: 300.0        # 카메라 양쪽 선이 곧으면(코너 벗어남) 문턱 -300부터. 도면 위치가 늦게 잡혀 늦게 켜지는 것 방지
                                           #   (11/11 시뮬레이션: 도면 -0.3 m면 앞 617 mm에서 켬·충돌 3 -> 914 mm·충돌 0)
    m7_trigger_fallback_mm: 1000.0         # 앞 차로에 장애물이 끝까지 없으면 시작선 + 이만큼에서 켬
    # 11/14 코너 미리보기 (m7_link 설명 8): 우하단 코너를 도는 동안 라이다로 3차선 입구를 미리 봄.
    #   코너 직후 2차선 막힘(시작선 + pre_block_x_mm 안) -> 1·3차선 장애물·막다름·꺾어 들어갈 여유를 같이 보고 갈 차로를 정함
    #   -> 회피 노드에 start_target으로 넘겨 켜자마자 그 차로로, 너무 가까우면 코너 60~75°에서 일찍 켬.
    #   시뮬레이션 m7_pre_sim (첫 2차선 LIMO 시작선 +0~1.5 m, 40배치): 후진 판 13 -> 2, 후진 합 11.6 -> 0.8 m, 평균 완주 38.2 -> 34.0 s
    #   로그: '[M7] 코너 미리보기 (코너 NN°): ...', /obstacle/state m7_pre. 끄기: m7_pre_enable false
    m7_pre_enable: true
    m7_pre_corner_r_mm: 640.0              # 코너 중심선 반경 (도면)
    m7_pre_corner_end_mm: -288.0           # 코너 끝 (시작선 기준, 도면)
    m7_pre_block_x_mm: 1500.0              # 2차선 장애물 앞면이 시작선 + 이 안이면 미리 정함 (더 멀면 회피 노드가 알아서)
    m7_pre_side_need_mm: 600.0             # 옆 차로가 2차선 장애물 앞면 + 이만큼까지 비어야 '빈 차로'
    m7_pre_dead_mm: 600.0                  # 옆 차로 다음 장애물과 2차선 다음 장애물이 이 안이면 막다른 차로 (두 칸 건너야 함)
    m7_pre_reach_margin_mm: 60.0           # 굴려 본 차 옆면 ~ 2차선 장애물 여유가 이 이상이어야 '꺾어 들어갈 수 있음' (150은 시뮬레이션에서 더 나쁨)
    m7_pre_enable_turn_deg: 60.0           # 가장 일찍 켜는 코너 각 (80°에서 못 비켜 갈 때만, 5° 단위로 가장 늦은 각). 50°는 코너 안 차로 이탈 늘어남
    # M7 끄기 (11/09): YOLO 갈림길 표지를 확인한 뒤 지나가면 끔. 예전 방식만: none
    m7_off_mode: sign                      # sign | none (none이어도 회피 노드 자체 종료·FSM 강제 종료는 그대로)
    m7_active_timeout_sec: 1.0             # 회피 노드 /avoid/active가 이만큼 끊기면 정지 (0.5 -> 1.0: 바쁜 CPU에서 잠깐 늦는 것까지 멈췄음)
    m7_hold_resume: true                   # 끊김으로 멈췄다가 active가 다시 오면 풀고 계속 (Ctrl+C로 놓은 것은 계속 정지)
    m7_off_sign_classes: [fork_a, fork_b]
    m7_off_sign_conf: 0.5
    m7_off_sign_window: 5
    m7_off_sign_need: 3                    # 최근 5프레임 중 3번 보이면 '표지 확인'
    m7_off_sign_lost_frames: 5             # 확인한 뒤 5프레임 연속 안 보이면 '지나감' -> 끔
    m7_off_sign_near_h_px: 0.0             # 표지 상자 높이가 이 이상이면 바로 끔 (0 = 안 씀, 실차로 정할 것)
    m7_off_gate_mm: 1500.0                 # 섬 앞 끝 1.5 m 안에서만 (멀리서 LIMO에 가려 사라지는 오판 방지)
    m7_off_sign_edge_px: 10.0              # 표지 상자가 화면 좌우 끝 10 px 안에 닿은 뒤 사라지면 '화면 밖으로 나감' = 지나감 (0 = 안 씀)
    m7_off_sign_edge_frames: 2             #   그 뒤 2프레임 연속 안 보이면 (한 번 놓친 것과 구분)
    m7_off_sign_img_w: 640.0
    m7_off_sign_after_mm: 400.0            # 지나감을 안 뒤 이만큼 더 가서 끔. 실차: 로그 '표지가 화면 옆으로 나감' 위치를 보고 맞춤

detector_node:
  ros__parameters:
    image_topic: /camera/color/image_raw
    model_path: '/home/wego/autorace_ws/models/autorace_yolo_v5.onnx'
    class_names: [red, yellow, green, fork_a, fork_b, pedestrian, bump, slow, parking]   # v5 모델 ID 순서 (기존과 동일)
    input_size: 640                       # ONNX 고정 입력. 320 사용 시 모델 경로와 함께 변경·재시작
    conf_threshold: 0.7
    # 11/09: 스레드 제한 없이 10Hz로 돌리면 실제 1.8Hz + 차선 노드 절반 속도. 2스레드·5Hz로 제한
    infer_hz: 5.0                          # CPU일 때
    ort_threads: 2                         # CPU일 때만 (GPU면 안 씀)
    # 11/16: GPU(TensorRT). model_path 옆 같은 이름 .engine 있으면 GPU, 없으면 위 CPU. 엔진: bash tools/build_trt.sh
    use_gpu: true
    engine_path: ''
    infer_hz_gpu: 15.0

class_command_node:
  ros__parameters:
    detections_topic: /perception/detections
    commands_topic: /perception/commands
    mission_topic: /mission/state          # state + route.last_fix/fixes 재사용
    context_timeout_sec: 1.0               # 구간/바닥 확인 유효 시간 (수신 후 단조 시계)
    conf_threshold: 0.7
    vote_window: 10                        # 최근 새 검출 프레임 10개
    vote_need: 7                           # 그중 7개 이상 검출 시 해당 명령 발행
    # 미션별 투표 기준 (최근 vote_window 프레임 중 몇 번). 0 = 위 vote_need. 제안값, TODO bag으로 조정
    #   잘못 보면 되돌릴 수 없는 것(갈림길 A/B는 한 번 정하면 안 바뀜, 신호등)은 엄하게
    #   놓치는 손해가 더 큰 것(서행·방지턱, 주차)은 느슨하게
    mode_vote_need.M1_TRAFFIC: 4                # 신호등 빨강/초록 (+ 보행자). 11/14: 7 -> 4 (YOLO 약 2.5장/초라 7장이면 초록 확정 2.4초 늦음, 1114_01)
    mode_vote_need.M2_FORK: 3                   # 갈림길 A/B. 11/12 밤 7 -> 3 + 창 안 기다림(early_confirm_modes): 표지를 3번 보면 바로 결정
    mode_vote_need.M7_OBSTACLE: 3               # 3차선에서 미리 보는 갈림길 A/B. 11/12 밤 7 -> 3 (위와 같음)
    early_confirm_modes: [M2_FORK, M7_OBSTACLE]   # 이 미션은 최근 10프레임이 다 차기 전에도 need번이면 바로 인정
    mode_vote_need.M3_PEDESTRIAN: 6             # 보행자: 잘못 보면 엉뚱한 선에 설 수 있어 중간
    mode_vote_need.M4_PARKING: 5                # 주차: 주차 노드가 선·리모 짝으로 다시 확인
    mode_vote_need.M5_BUMP: 5                   # 서행·방지턱: 잘못 봐도 시간만 조금 손해
    mode_vote_need.M6_ZIGZAG: 0                 # (받는 표지 없음)
    mode_vote_need.M8_CONES: 0                  # (받는 표지 없음)
    mode_vote_need.M2_EXIT: 0                   # (받는 표지 없음)
    yellow_action: none                    # none: 명령 없음, pause: 정지선 앞 정지 요청
    # 원본 영상 bbox 높이(px). 0=크기 필터 끔. 현장 시험 후 클래스별 조정.
    min_bbox_height_px.red: 0.0
    min_bbox_height_px.yellow: 0.0
    min_bbox_height_px.green: 0.0
    min_bbox_height_px.fork_a: 0.0
    min_bbox_height_px.fork_b: 0.0
    min_bbox_height_px.pedestrian: 0.0
    min_bbox_height_px.bump: 0.0
    min_bbox_height_px.slow: 0.0
    min_bbox_height_px.parking: 0.0

parking_node:
  ros__parameters:
    odom_topic: /odom
    imu_topic: /imu
    scan_topic: /scan
    enabled: false                         # 실차 시험 전까지 false (docs/CHANGES_20261109_parking.md 순서대로 확인 후 true)
    # ---- 실측 필요 (TODO): tools/parking_scan_check.py, 줄자. 기본값은 추정
    front_axle_from_lidar_mm: -47.0        # 라이다 -> 앞바퀴 축 앞뒤 거리, 앞 +. 라이다가 47mm 앞이면 -47 (calib 5번 해석)
    front_bumper_from_axle_mm: 56.0        # 앞바퀴 축 -> 앞범퍼
    body_center_from_rear_mm: 105.0        # 뒷바퀴 축 -> 차체 중심 (오버행 앞뒤 같다고 가정)
    laser_yaw: 0.0                         # 라이다 정면 각도 보정 (rad)
    target_offset_mm: 50.0                 # 흰 선 뒤 차로 중심에서 왼쪽으로 (왼쪽 차선과 약 8cm, 차로 안쪽 폭 480 가정)
    # ---- 두 리모 중점 / 꺾기 (도면·calib 근거, 바꿀 일 적음)
    target_row: front                      # 들어갈 줄 고정 (11/10 대회 배치 = 2번). back = 5번, auto = 짝 줄로 판단
    pair_trigger: true                     # 흰 선을 못 봐도 오른쪽 1·3번 짝을 연속으로 보면 주차 시작 (주차 표지/armed일 때만)
    pair_trigger_frames: 3
    pair_dist_mm: 1040.0                   # 정차 리모 두 대 사이 = 칸 2개 (500 + 20 + 500 + 20)
    pair_tol_mm: 230.0                     # 11/13: 150 -> 230. 실차 시험 상자 1·3번 간격 94cm (리모면 104)가 범위 끝이었음
    turn_lead_mm: 320.0                    # 칸 가운데가 앞바퀴보다 이만큼 앞일 때 꺾기 (회전반경 530 - 축거 210)
    straighten_yaw_deg: 87.0               # 이만큼 돌면 바퀴 펴기 (정지 후 2~4도 더 돎, calib 3번)
    max_realign: 0                         # 재정렬 최대 횟수 (0 = 끔). 11/12: 2 -> 0 (만점 자리에서도 후진·재진입 반복, 고쳐지지도 않음)
    follow_col5: false                     # 11/13 캡틴: 끔. 원을 접선까지 다 그림 (켜면 70°부터 5번 선을 비스듬히 쫓아 끝 방향 6~12° 틀어지고 5번 쪽으로 붙음)
    side_guard_mm: 50.0                    # 꺾는 중·들어가는 중 리모까지 이보다 가까우면 멈추고 재정렬. 0 = 끔
    final_head_tol_deg: 4.0                # 끝 정렬: 방향이 이보다 틀어지면 한 번 더 (시간이 아까우면 크게)
    final_lat_tol_mm: 30.0                 # 끝 정렬: 차체 중심이 칸 가운데에서 이보다 벗어나면 한 번 더
    pullout_steer: true                    # 재정렬 후진 때 (앞범퍼가 옆 리모를 지난 뒤) 꺾으며 후진
    pullout_mm: 500.0                      # 재정렬 후진 거리. 650이면 왼쪽 노란 선 밟음 (11/11 실차, 시뮬레이션 -0.8cm). 500 = 여유 약 10cm
    pause_sec: 0.3                         # 꺾기 전 정지 (1.0 -> 0.3, 11/11). 0.18m/s 제동 약 0.26초
    car_min_size_mm: 150.0                 # 짝 찾기: 이보다 작은 덩어리 버림 (60 -> 150, 11/12). 주차 표지판 기둥이 1번 리모와 짝이 되면
                                           #   빈 칸(1번 앞)으로 들어감. 리모 옆면 220mm. 시뮬레이션: 기둥 8cm 2/12 -> 12/12, 대회 배치 12/12 그대로
    single_fallback: false                 # 짝 없이 오른쪽 물체 하나 보고 꺾기(V1 예비). 11/12 전체 주행: 표지판에 속아 1번 칸 충돌 -> 끔
    skip_wait_line: true                   # 11/12: 흰 선 안 기다리고 바로 1·3번 짝 찾기 (mission_node m4_direct와 같이 켬/끔)
    follow_max_direct_mm: 3500.0           # 짝 없이 이만큼 가면 멈춤 (도면: M4 시작 ~3.8m, 꺾는 곳 ~6.56m, 차선 끝 8.13m)
    wait_blocked_before_pair: true         # 짝 찾기 전 앞이 막히면 주차를 끝내지 말고 서서 기다림
    turn_ref: fixed                        # 11/16 캡틴: 고정 거리 방식 (주차선 정지 -> 87cm -> 최대 조향 87도). 예전 방식으로 되돌리기: path (11/13 캡틴 경로: 1·3·5번 인식 -> Q -> 원호)
    # 11/16 캡틴 '고정 거리' 방식: turn_ref를 fixed로 바꾸면 사용 (실행 중: ros2 param set /parking_node turn_ref fixed, M4 들어가기 전에)
    #   주차선 정지(앞바퀴 선 15cm 앞) -> 0.3초 -> 104cm 직진 -> 0.3초(조향 미리) -> 오른쪽 최대 조향 87도(IMU) -> (직진) -> 정지
    #   시뮬레이션(반경 560~650, 서보 지연 0~120mm, 차로 왼쪽 5cm): 모두 2번 칸 안·충돌 없음. 반경 590: 칸 가운데 ±1cm, 앞 여유 7cm
    fixed_line_target_mm: 56.0             # 앞바퀴가 주차선 이만큼 앞에서 정지. 11/16 캡틴 그림: 앞범퍼가 선에 닿게 = 앞바퀴→앞범퍼 56
    fixed_first_min_mm: 250.0              # 처음 잡는 주차선은 25cm보다 멀리 보인 것만 (통주행 M4 시작 때 12cm 앞 횡단보도 끝 선 무시)
    fixed_brake_mm: 0.0                    # 정지 명령 뒤 밀리는 거리 (미측정)
    fixed_pause_sec: 0.3
    fixed_move_mm: 820.0                   # 칸 감지 꺼졌을 때 쓰는 값. 11/18 현장: 늦게 꺾어서 870 -> 820. 3번 쪽으로 붙으면 줄이고 1번 쪽이면 늘림 (1cm = 10)
    # 11/17 공지: 빈 칸 랜덤 -> 선에서 서 있는 1초 동안 라이다로 앞줄 1·2·3번 중 빈 칸 찾기 -> 칸별 직진 거리
    fixed_detect: true
    fixed_detect_sec: 1.0
    fixed_cells_move_mm: [334.0, 820.0, 1328.0]   # 1·2·3번 칸 직진. 11/18 현장: 늦게 꺾어서 전부 -50 (이전 384/870/1378 = 11/17 선배 기록 m4_1~3.csv 기준)
    fixed_cell_ranges_mm: [500.0, 1020.0, 1030.0, 1530.0, 1540.0, 2040.0]   # 11/18 캡틴: 칸별 라이다 앞 거리 (1번 50~102 / 2번 103~153 / 3번 154~204cm)
    fixed_force_cell: 0                    # 1~3이면 그 칸으로 강제 (시험용), 0 = 자동
    fixed_move_speed: 0.10
    fixed_turn_pause_sec: 0.3              # 0이면 멈추지 않고 바로 꺾음 (서보가 늦게 꺾여 원이 커질 수 있음)
    fixed_turn_deg: 87.0                   # 최대 조향 끝 = IMU 87도 (실차는 2~4도 더 돎)
    fixed_turn_mm: 0.0                     # 11/16 캡틴 실차 확정: 끔 (회전은 IMU 87도로 끝). >0이면 이 거리에서도 끝
    fixed_line_max_mm: 4000.0              # 선을 못 보고 이만큼 가면 FAIL_NO_LINE (정지)
                                           #   목표 l5 = 5번 중심(없으면 1·3번 중점), Q(뒷바퀴) = l5 - arc_radius_mm. (target = 꼭짓점 기준 꺾기)
    arc_radius_mm: 590.0                   # 11/16: 640 -> 590 (1116_01 미리 꺾기로 바퀴가 다 꺾인 채 돌면 IMU 반경 585~605. 640은 바퀴 꺾이는 구간까지 섞인 값). 11/15: 1114 bag 주차 TURN을 IMU로 재니 590~720(가운데 640). 예전 529(오도메트리 곡률 1.89 기준)는 실제보다 작아 칸에서 왼쪽으로 9~16 cm 치우침
    presteer_sec: 0.4                      # 11/15: 멈춤 끝 0.4초 동안 0.025 m/s로 굴리며 다음 조향을 미리 꺾음 (브리지가 서 있을 땐 조향 0이라 출발 때 원이 커짐)
    turn_fix: true                         # 11/15: 도는 중(30~65°) 실제 반경을 재서 칸에서 35 mm 넘게 벗어날 것 같으면 왼쪽 최대 조향 짧게 후진(끊어 넣기) / 바퀴 펴고 더 감
    turn_fix_tol_mm: 50.0                  # 11/16 35 -> 50 (1116_01: 반경을 짧게 재 반대로 고침 -8.8 cm -> 실제 +12.7 cm)
    turn_fix_meas_span_deg: 20.0           # 11/16 12 -> 20: 반경을 더 길게 재서
    turn_fix_from_deg: 35.0
    turn_fix_gain: 0.7                     # 예측 옆 오차의 70%만 고침
    straight_align_gain: 3.0               # 11/16: 바퀴 편 뒤 칸 방향과 나란하게 좌우 살짝 (너무 꺾었으면 왼쪽으로도)
    center_pullout_per_mm: 0.0             # 11/16: 2.0 -> 0 (1116_01: 오차 127 mm에 700 mm까지 빠짐, 사용자 '너무 많이 뒤로'). 11/15: 450 + 2 x 옆 오차
    center_pullout_max_mm: 700.0
    center_look_mm: 130.0                  # 11/16 180 -> 130: 빠질 때·다시 들어갈 때 바퀴를 더 적극적으로 (옆으로 빨리 붙음)
    settle_sec: 1.0                        # path: 다 인식하면 서서 다시 재는 시간
    stop_turn_deg: 86.0                    # path: 86도 넘게 돈 뒤 앞범퍼 R에서 정지. 87도에 바퀴 펴면 실차는 2~4도 더 돎(calib 3번)
    stop_hard_mm: 200.0                    # path: 앞범퍼 -> 정면 20cm 안이면 몇 도든 정지
#   (이전 target 설명) 목표 = 1·3번 중심선 ∩ 5번 중심선(가까이서 잰 중앙값), 1번 꼭짓점 기준으로 꺾는 시점 계산.
                                           #   상자 크기·간격과 무관 (corner = 리모 폭 가정, pair = 예전 짝 중점 평균)
    turn_lead_lidar_mm: 273.0              # target: 라이다가 목표 27.3cm 전에 오면 꺾기 (= turn_lead 320 - 라이다 47). 실차로 맞출 것
    turn_from_corner_mm: 140.0             #   라이다가 모서리 선을 이만큼 지나면 꺾기 (turn_lead 320 환산. 실차로 맞출 것)
    stop_from_col5_mm: 300.0               # 11/13 캡틴 R: 앞범퍼 -> 5번 30cm면 정지 (리모·오늘 상자 기준 앞뒤 모두 칸 안, 22 -> 30)
    publish_lane_cfg: false                # 11/12: 차선 오프셋은 미션 노드가 보냄 (m4_target_offset_mm). 둘이 보내면 1초마다 덮어씀
    guard_stop_mm: 20.0                    # 재정렬 끈 상태에서 꺾는 중 리모에 2cm보다 가까우면 박기 전에 정지
    # 11/13 실차 (캡틴): 앞 15cm 안 물체면 멈춤, 후진 15cm, 전진<->후진 0.5초 멈춤, 양옆 리모 정중앙에 세우기
    front_stop_mm: 150.0                   # 앞범퍼 앞 이 안 물체 = 막힘 -> 멈추고 후진 (예전 60)
    back_mm: 150.0                         # 막혔을 때 후진 거리 (예전 50: 5cm씩 4번 왔다갔다)
    switch_pause_sec: 0.5                  # 전진 <-> 후진 바꿀 때 멈춤
    center_on_sides: false                 # 11/13 캡틴: 끔 (원을 접선까지). true면 70°부터 양옆 리모 정중앙 선을 따라 들어감
    center_check: true                     # 11/14 캡틴: 다시 켬 (끝에서 선 밟음 -> 양옆 정중앙 맞추기). center_on_sides가 꺼져 있어도 이제 끝에서 잰다 (예전엔 안 쟀음).
                                           #   양옆 물체 안쪽 면이 앞바퀴 0~420mm 띠에 둘 다 보이고 그 사이가 650~1000mm일 때만. 시뮬레이션: 회전반경·라이다 위치 ±4~5cm 오차 -32/+48/+34mm -> -13/-3/-2mm (약 10초 더 걸림)
                                           # (11/13 캡틴: 끔 (경로 방식은 한 번에 넣기, 후진·재진입 안 함). true면 끝에서 양옆 리모 정중앙에서 center_tol_mm 넘게 벗어났으면 45cm 빼서 정중앙 선 따라 다시 (최대 2번)
    center_retries: 2
    center_tol_mm: 50.0                    # 11/16 15 -> 50 (사용자: 정중앙 ±20%면 끝. 양옆 여유 합 약 28 cm의 ±20% ≈ ±55 mm). 예전 15
    center_pullout_mm: 320.0               # 11/16 450 -> 320: 앞범퍼가 옆 상자를 벗어날 만큼만 빼고 바로 반대로 꺾음 (예전 450)
    guard_back: true                       # 옆 2cm 감시에 걸리면 그 자리에서 끝내지 말고 15cm 후진 뒤 다시 (최대 3번)
    guard_back_max: 3
    back_reverse_scale: 0.10               # 11/14: 기억후진 시 잘못 들었던 길로 갈 때 꺾었던 조향의 반대 방향 10% 조향

ackermann_bridge:
  ros__parameters:
    # 11/15: 모든 커브에서 바깥으로 밀림의 원인. 브리지는 조향각 = atan(축거 x angular.z / v)인데 launch가 이 값을 안 넘겨
    #   기본 0.2로 돌았다. 실측 유효 축거 0.222 (최대 조향 0.40 rad에서 잰 곡률 1.89 = tan(0.40)/0.222, 회피 노드도 0.222).
    #   0.2로 계산하면 명령보다 약 11% 덜 꺾임 (docs/CHANGES_20261106_M7.md에 적혀 있었으나 안 고쳐져 있었음)
    wheelbase: 0.222
    max_steer: 0.40
    # 11/15 (1114 bag, 축거 0.2로 돈 판): R640 코너 실제 곡률(IMU)이 명령의 약 80% -> 필요 배율 약 1.25.
    #   축거 0.222(약 1.11배) x 차선 코너 배율 corner_kappa_gain 1.1 = 코너에서 약 1.22배라 여기는 1.0 (겹치면 1.34배로 안쪽 침범).
    #   실차에서 아직 바깥으로 밀리면 1.05~1.1
    steer_gain: 1.0
